name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Preparar wallpaper Snoopy
        run: |
          mkdir -p app/src/main/assets/wallpapers
          if [ ! -f "app/src/main/assets/wallpapers/snoopy.jpg" ]; then
            curl -L "https://picsum.photos/1920/1080" -o app/src/main/assets/wallpapers/snoopy.jpg || true
          fi

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Listar APKs generados
        run: find app/build/outputs -name "*.apk" -type f

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: TCLLauncher-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
