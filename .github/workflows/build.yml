name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar wallpaper Snoopy
        run: |
          mkdir -p app/src/main/assets/wallpapers
          if [ ! -f "app/src/main/assets/wallpapers/snoopy.jpg" ]; then
            curl -L "https://picsum.photos/1920/1080" -o app/src/main/assets/wallpapers/snoopy.jpg || true
          fi

      - name: Reparar gradle wrapper
        run: |
          curl -L "https://github.com/gradle/gradle/raw/refs/tags/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          java -jar gradle/wrapper/gradle-wrapper.jar --version || true

      - name: Compilar APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Firmar APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          echo "Build tools: $BUILD_TOOLS"

          keytool -genkey -v \
            -keystore keystore.jks \
            -alias launcher \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=TCLLauncher, OU=Dev, O=DETEXT0, L=Bogota, S=Cundinamarca, C=CO"

          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/TCLLauncher.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: TCLLauncher-APK
          path: app/build/outputs/apk/release/TCLLauncher.apk
          retention-days: 30
